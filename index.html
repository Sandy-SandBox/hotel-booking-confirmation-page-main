<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz@0,9..144;1,9..144&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Mentor | Hotel booking confirmation page</title>
  </head>
  <body>
    <main class="main">
      <!-- Sidebar -->
      <!-- Header -->
      <header class="header | flex-center">
        <div class="wrapper | flex flex-justify-between flex-items-center">
          <a href="#" class="header__logo">
            <img src="./assets/images/logo.svg" alt="Maison Soleil logo" />
          </a>

          <label
            class="header__menu"
            for="nav-toggle"
            aria-controls="primary-navigation"
          >
            <img
              src="./assets/images/icon-menu.svg"
              class="header__menu-icon header__menu-icon--open"
              alt="menu icon open"
            />
            <img
              src="./assets/images/icon-close.svg"
              class="header__menu-icon header__menu-icon--close"
              alt="menu icon close"
            />
          </label>
        </div>
      </header>
      <aside class="sidebar">
        <!-- Used for navigation toggling -->
        <input type="checkbox" id="nav-toggle" />
        <!-- Navigation -->
        <div class="sidebar__content">
          <nav class="nav">
            <ul class="nav__list" role="list">
              <li class="nav__item">
                <a href="#" class="nav__link nav__link--active">
                  <img
                    src="./assets/images/icon-bed.svg"
                    alt="bed icon"
                    class="nav__icon"
                  />
                  <span class="nav__link-txt">Your stay</span>

                  <span class="nav__link-noti">1</span>
                </a>
              </li>
              <li class="nav__item">
                <a href="#" class="nav__link">
                  <img
                    src="./assets/images/icon-house.svg"
                    alt="house icon"
                    class="nav__icon"
                  />
                  <span class="nav__link-txt">The house</span>
                </a>
              </li>
              <li class="nav__item">
                <a href="#" class="nav__link">
                  <img
                    src="./assets/images/icon-pin.svg"
                    alt="pin icon"
                    class="nav__icon"
                  />
                  <span class="nav__link-txt">Around town</span>
                </a>
              </li>
              <li class="nav__item">
                <a href="#" class="nav__link">
                  <img
                    src="./assets/images/icon-breakfast-outline.svg"
                    alt="bell icon"
                    class="nav__icon"
                  />
                  <span class="nav__link-txt">Breakfast</span>
                </a>
              </li>
              <li class="nav__item">
                <a href="#" class="nav__link">
                  <img
                    src="./assets/images/icon-mail.svg"
                    alt="mail icon"
                    class="nav__icon"
                  />
                  <span class="nav__link-txt">Messages</span>
                </a>
              </li>
            </ul>
          </nav>
          <div class="weather">
            <p class="weather__location">Today in cassis</p>
            <p class="weather__temp">27<sup>&deg;</sup></p>
            <p class="weather__weather">Sunny . light breeze</p>
            <img
              src="./assets/images/icon-weather.svg"
              class="weather__icon"
              alt="weather icon"
            />
          </div>
        </div>

        <footer class="footer">
          <span>EST. 1987</span>
          <span>Maison Soleil · 12 Rue des Oliviers · Cassis</span>
          <span>&copy; 2026 Maison Soleil</span>
        </footer>
      </aside>

      <section class="hero">
        <div class="wrapper">
          <a href="#">I am hero</a>
        </div>
      </section>
    </main>
    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
